name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  make-all:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Identify exact compiler and runtime build
        id: toolchain
        run: |
          mise exec -- elixir -e 'fingerprint = {System.build_info(), :erlang.system_info(:system_version)}; IO.puts("cache_id=" <> Base.encode16(:crypto.hash(:sha256, :erlang.term_to_binary(fingerprint)), case: :lower))' >> "$GITHUB_OUTPUT"

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-v2-${{ steps.toolchain.outputs.cache_id }}-${{ hashFiles('elixir/mix.lock') }}

      - name: Verify make all
        run: make all
